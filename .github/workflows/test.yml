name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y verapdf

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install verapdf

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install verapdf -y --no-progress
        env:
          CHOCOLATEY_FAILED_INSTALL_COUNT: 3

      - name: Verify veraPDF is available
        run: verapdf --version

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/pip install pytest-cov

      - name: Run tests with coverage
        run: |
          .venv/bin/pytest -q --cov=accessipdf --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e .
          .venv/bin/pip install mypy

      - name: Run mypy
        run: .venv/bin/mypy accessipdf/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff check
        run: ruff check accessipdf/ tests/ scripts/

      - name: Run ruff format check
        run: ruff format --check accessipdf/ tests/ scripts/

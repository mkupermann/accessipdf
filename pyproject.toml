[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessipdf"
version = "0.1.0"
description = "Make existing PDFs accessible: template-driven PDF/UA-1 tagging engine, pixel-identical output, veraPDF-gated"
requires-python = ">=3.12"
dependencies = [
    "pikepdf>=9",
    "pypdfium2>=4",
    "PyYAML>=6",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
accessipdf = "accessipdf.cli:main"

[tool.setuptools.packages.find]
include = ["accessipdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessipdf"
version = "0.1.0"
description = "Make existing PDFs accessible: template-driven PDF/UA-1 tagging engine, pixel-identical output, veraPDF-gated"
requires-python = ">=3.12"
dependencies = [
    "pikepdf>=9",
    "pypdfium2>=4",
    "PyYAML>=6",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML>=6",
    "streamlit>=1.30",
    "playwright>=1.40",
]

[project.scripts]
accessipdf = "accessipdf.cli:main"

[tool.setuptools.packages.find]
include = ["accessipdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long - handled by ruff format
    "N803",  # invalid argument name (allow 'seiten', 'bbox', etc. - German names)
    "N806",  # variable in function should be lowercase (allow 'Template', 'Zone', etc.)
    "N815",  # mixed case variable in global scope
    "N818",  # Exception name should end with Error
    "B905",  # zip() without explicit strict= parameter
    "SIM101", # Multiple isinstance calls
    "SIM117", # Multiple with statements (needed for Streamlit spinner context)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
disallow_any_unimported = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pikepdf.*",
    "pypdfium2.*",
    "yaml",
]
ignore_missing_imports = true
